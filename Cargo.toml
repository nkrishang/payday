[workspace]
resolver = "2"
members = [
    "crates/gateway-core",
    "crates/gateway-db",
    "crates/gatewayd",
    "crates/gateway-indexer",
    "crates/gateway-cli",
]

[workspace.dependencies]
alloy-primitives = { version = "1.6.1", features = ["serde"] }
alloy-json-rpc = "1"
alloy-sol-types = "1.6.1"
alloy-provider = { version = "1", features = ["reqwest-rustls-tls"] }
alloy-network = "1"
alloy-rpc-types-eth = "1"
alloy-signer-local = "1"
alloy-transport = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v7", "serde"] }
rand = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "macros", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
subtle = "2.6"
tower = "0.5"
