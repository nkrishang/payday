[workspace]
resolver = "2"
members = [
    "crates/gateway-core",
    "crates/gatewayd",
    "crates/gateway-cli",
]

[workspace.dependencies]
alloy-primitives = { version = "1.6.1", features = ["serde"] }
alloy-sol-types = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v7", "serde"] }
rand = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "macros", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
serde_json = "1"