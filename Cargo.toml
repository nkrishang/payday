[workspace]
resolver = "2"
members = [
    "crates/gateway-core",
    "crates/gatewayd",
    "crates/gateway-cli",
]

[workspace.dependencies]
alloy-primitives = { version = "1.6.1", features = ["serde"] }
alloy-sol-types = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v7", "serde"] }
rand = "0.9"