name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  unix:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: payday-linux-x86_64
          - runner: macos-26-intel
            artifact: payday-macos-x86_64
          - runner: macos-26
            artifact: payday-macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p gateway-cli --bin payday
      - run: |
          mkdir dist
          cp target/release/payday dist/payday
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" payday
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p gateway-cli --bin payday
      - shell: pwsh
        run: Compress-Archive target/release/payday.exe payday-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: payday-windows-x86_64
          path: payday-windows-x86_64.zip

  release:
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum -- * > SHA256SUMS)
      - run: scripts/generate-homebrew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > dist/payday.rb
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
