name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  unix:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: gateway-cli-linux-x86_64
          - runner: macos-26-intel
            artifact: gateway-cli-macos-x86_64
          - runner: macos-26
            artifact: gateway-cli-macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p gateway-cli
      - run: |
          mkdir dist
          cp target/release/gateway-cli dist/gateway-cli
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" gateway-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p gateway-cli
      - shell: pwsh
        run: Compress-Archive target/release/gateway-cli.exe gateway-cli-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-cli-windows-x86_64
          path: gateway-cli-windows-x86_64.zip

  release:
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
