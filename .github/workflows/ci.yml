name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --no-deps
      - run: cargo build --locked -p gateway-core --bin derive-address
      - run: forge test

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: gatewayd
          push: false
          tags: payday-api:test
          cache-from: type=gha,scope=containers
          cache-to: type=gha,mode=max,scope=containers
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway-indexer
          push: false
          tags: payday-indexer:test
          cache-from: type=gha,scope=containers
          cache-to: type=gha,mode=max,scope=containers

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/push-images.sh
      - run: shellcheck scripts/push-images.sh
