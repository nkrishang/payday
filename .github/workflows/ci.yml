name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cargo-fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  forge-fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check

  cargo-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gateway
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  auth0-action-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: node --test auth0/actions/*.test.js auth0/email/*.test.js

  web:
    runs-on: ubuntu-24.04
    env:
      # Build-time values only. Everything here is public by definition: it is
      # inlined into the browser bundle. Production values live in Vercel.
      NEXT_PUBLIC_PAYDAY_API_URL: https://api.payday.sh
      NEXT_PUBLIC_CHAIN_ID: "143"
      NEXT_PUBLIC_CHAIN_NAME: Monad
      NEXT_PUBLIC_RPC_URL: https://rpc.monad.xyz
      NEXT_PUBLIC_USDC_ADDRESS: "0x754704Bc059F8C67012fEd69BC8A327a5aafb603"
      NEXT_PUBLIC_EXPLORER_BASE_URL: https://monadvision.com
      # The landing page prerenders the sign-in dialog, which needs an app id
      # at build time; Privy app ids are public, and this is the development
      # app. The browser suite swaps Privy for its stub regardless.
      NEXT_PUBLIC_PRIVY_APP_ID: cmt9wxn7h011h0cjsma7fzytr
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace @payday/sdk
      - run: npm run typecheck --workspace @payday/web
      - run: npm run lint --workspace @payday/web
      - run: npm test --workspace @payday/web
      - run: npm run build --workspace @payday/web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e --workspace @payday/web
      # Development and production differ enough to break one and not the
      # other, so the same specs run against both servers.
      - run: npm run test:e2e:dev --workspace @payday/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  forge-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cargo build --locked -p gateway-core --bin derive-address
      - run: forge test

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --no-deps

  e2e-anvil:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gateway
      PAYDAY_BATCH_SWEEPER_ADDRESS: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cargo build --workspace --locked
      - run: scripts/e2e-anvil.sh

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: gatewayd
          push: false
          tags: payday-api:test
          cache-from: type=gha,scope=containers
          cache-to: type=gha,mode=max,scope=containers
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway-indexer
          push: false
          tags: payday-indexer:test
          cache-from: type=gha,scope=containers
          cache-to: type=gha,mode=max,scope=containers

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=auth0 fmt -check -recursive
      - run: terraform -chdir=auth0 init -backend=false
      - run: terraform -chdir=auth0 validate

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/*.sh
      - run: shellcheck scripts/*.sh
