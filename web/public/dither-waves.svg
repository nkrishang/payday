<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none">
  <defs>
    <pattern id="fine-dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.8" fill="#9CA19B"/>
    </pattern>
    <filter id="soft-wave" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="wide-wave" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <mask id="lower-field">
      <rect width="1600" height="560" fill="black"/>
      <path d="M-180 520C90 245 330 575 625 418C900 272 1045 154 1378 340C1510 414 1605 426 1760 318" stroke="white" stroke-width="180" stroke-linecap="round" filter="url(#wide-wave)"/>
      <path d="M-160 562C108 330 344 626 650 470C930 327 1092 230 1400 402C1532 476 1640 472 1768 382" stroke="white" stroke-width="76" stroke-linecap="round" filter="url(#soft-wave)"/>
    </mask>
    <mask id="upper-field">
      <rect width="1600" height="560" fill="black"/>
      <path d="M1010 -118C1182 35 1157 200 1322 276C1450 335 1580 258 1730 412" stroke="white" stroke-width="166" stroke-linecap="round" filter="url(#wide-wave)"/>
      <path d="M1120 -102C1250 55 1228 170 1365 230C1474 278 1582 225 1708 340" stroke="white" stroke-width="62" stroke-linecap="round" filter="url(#soft-wave)"/>
    </mask>
    <radialGradient id="edge-fade" cx="0" cy="0" r="1" gradientTransform="translate(800 280) rotate(90) scale(360 820)" gradientUnits="userSpaceOnUse">
      <stop offset="0.18" stop-color="black"/>
      <stop offset="0.58" stop-color="white" stop-opacity="0.7"/>
      <stop offset="1" stop-color="white"/>
    </radialGradient>
    <mask id="composition-fade">
      <rect width="1600" height="560" fill="url(#edge-fade)"/>
    </mask>
  </defs>

  <g mask="url(#composition-fade)">
    <g mask="url(#lower-field)" opacity="0.42">
      <rect width="1600" height="560" fill="url(#fine-dots)"/>
    </g>
    <g mask="url(#upper-field)" opacity="0.34">
      <rect width="1600" height="560" fill="url(#fine-dots)"/>
    </g>
  </g>
</svg>
