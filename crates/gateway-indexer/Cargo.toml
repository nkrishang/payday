[package]
name = "gateway-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
gateway-core = { path = "../gateway-core" }
gateway-db = { path = "../gateway-db" }
gateway-relay = { path = "../gateway-relay" }
alloy-primitives = { workspace = true }
