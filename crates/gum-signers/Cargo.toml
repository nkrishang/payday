[package]
name = "gum-signers"
version = "0.1.0"
edition = "2024"
description = "Execution service: the only key holder; consumes execution commands, manages the KMS signer pool, submits and tracks transactions"

[dependencies]
gum-core = { path = "../gum-core" }
gum-chain = { path = "../gum-chain" }
gum-contracts = { path = "../gum-contracts" }
gum-bus = { path = "../gum-bus" }
gum-schema = { path = "../gum-schema" }
gum-telemetry = { path = "../gum-telemetry" }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-network = { workspace = true }
alloy-signer-aws = { workspace = true }
alloy-signer-local = { workspace = true }
aws-config = { workspace = true }
aws-sdk-kms = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
gum-chain = { path = "../gum-chain", features = ["mock"] }
gum-core = { path = "../gum-core", features = ["test-helpers"] }
