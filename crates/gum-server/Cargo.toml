[package]
name = "gum-server"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = { workspace = true }
gum-core = { path = "../gum-core" }
gum-ledger = { path = "../gum-ledger" }
gum-relay = { path = "../gum-relay" }
gum-chain = { path = "../gum-chain" }
gum-contracts = { path = "../gum-contracts" }
gum-bus = { path = "../gum-bus" }
gum-schema = { path = "../gum-schema" }
gum-telemetry = { path = "../gum-telemetry" }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-signer = { workspace = true }
alloy-signer-aws = { workspace = true }
alloy-signer-local = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
aes-gcm = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
utoipa = { workspace = true }
qrcode = { workspace = true }
aws-config = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
aws-sdk-kms = { workspace = true }
aws-sdk-s3 = { workspace = true }
pdf-writer = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
gum-chain = { path = "../gum-chain", features = ["mock"] }
gum-core = { path = "../gum-core", features = ["test-helpers"] }
gum-ledger = { path = "../gum-ledger", features = ["test-helpers"] }
rsa = { version = "0.9", features = ["pem"] }
# Privy signs with ES256; tests mint their own P-256 key to stand in for it.
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
rand_08 = { package = "rand", version = "0.8" }
